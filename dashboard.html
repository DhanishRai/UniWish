<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>UniWish — Dashboard</title>
    <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
    <div class="container">
        <header class="top-nav">
            <div class="brand">
                <img src="icons/icon.png" class="logo" alt="UniWish" />
                <h1>UniWish Master Wishlist</h1>
            </div>
            <input type="text" id="dashSearch" placeholder="Search wishlisted items..." />
        </header>

        <div class="categories" id="dashChips">
            <button class="chip active" data-filter="all">All Stores</button>
            <button class="chip" data-filter="amazon">Amazon</button>
            <button class="chip" data-filter="flipkart">Flipkart</button>
            <button class="chip" data-filter="myntra">Myntra</button>
            <button class="chip" data-filter="food">Food</button>
            <button class="chip" data-filter="others">Others</button>
        </div>

        <main class="grid" id="dashGrid"></main>
    </div>

    <script src="dashboard.js"></script>
</body>

</html>
